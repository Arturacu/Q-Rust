name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --workspace --all-features --verbose

  comparison-regressions:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      QISKIT_NUM_PROCS: '1'
      QISKIT_PARALLEL: 'FALSE'
      QRUST_COMPARISON_BINARY: target/release/comparison_runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements-comparison.txt
      - name: Install pinned compiler comparison dependencies
        run: python -m pip install -r experiments/requirements-comparison.txt
      - name: Build public compiler adapter for numerical regressions
        run: cargo build --release -p qrust-bench --bin comparison_runner
      - name: Test adapters independent checker and analysis
        run: python -m unittest discover -s experiments -p 'test_*.py'
